<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 128px; height: 128px; overflow: hidden; }
  body {
    background: #18181B;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  i { display: block; height: 11px; border-radius: 6px; }
  i.a { width: 46px; background: #FAFAFA; }
  i.b { width: 60px; background: #A1A1AA; }
  i.c { width: 34px; background: #A1A1AA; }
</style>
</head>
<body>
  <i class="a"></i>
  <i class="b"></i>
  <i class="c"></i>
</body>
</html>
